<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08000d">
    <title>J.A.R.V.I.S. — Black Hole Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
      }
    }
    </script>
</head>
<body data-state="idle">
    <div id="info">
        Black Hole Core<br>
        <span style="font-size: 14px; opacity: 0.8;">Clique e arraste para orbitar o núcleo</span>
    </div>

    <div class="jarvis-overlay">
        <header class="jarvis-topbar">
            <div>
                <span class="brand-kicker">PROJETO TIPO JARVIS</span>
                <h1 class="jarvis-title">J.A.R.V.I.S.</h1>
            </div>
            <div class="status-pill" aria-live="polite">
                <span id="statusDot" class="status-dot" data-state="idle"></span>
                <span id="statusText">Jarvis em espera</span>
            </div>
        </header>

        <div class="center-readout" aria-hidden="true">
            <span id="coreActionLabel" class="core-action">JARVIS CORE ONLINE</span>
        </div>

        <section class="command-dock">
            <div class="conversation-card" aria-live="polite">
                <div class="conversation-header">
                    <span>ASSISTENTE IA</span>
                    <small id="aiMode">Gemini + voz + ações</small>
                </div>
                <p id="responseText">Núcleo online. Diga “Jarvis” ou digite um comando.</p>
                <div class="quick-row">
                    <button class="quick-command" type="button" data-command="abra o YouTube">YouTube</button>
                    <button class="quick-command" type="button" data-command="abra a calculadora">Calculadora</button>
                    <button class="quick-command" type="button" data-command="abra o VS Code">VS Code</button>
                    <button class="quick-command" type="button" data-command="que horas são">Hora</button>
                    <button class="quick-command" type="button" data-command="quem é você">Identidade</button>
                </div>
            </div>

            <div class="input-wrapper">
                <button id="micBtn" type="button" aria-label="Ativar ou desativar microfone" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"></path>
                        <path d="M19 11a7 7 0 0 1-14 0"></path>
                        <path d="M12 18v3"></path>
                        <path d="M8 21h8"></path>
                    </svg>
                </button>

                <input type="text" id="morphText" placeholder="Pergunte ou peça uma ação ao Jarvis..." maxlength="500" autocomplete="off">

                <button id="typeBtn" type="button" aria-label="Enviar comando">
                    <span class="button-content">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span>Enviar</span>
                    </span>
                </button>
            </div>
        </section>
    </div>

    <script src="assistant-core.js"></script>
    <script src="actions.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
